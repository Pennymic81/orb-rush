<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb Rush</title>
<style>
  html,body{margin:0;height:100%;background:#f6f5ee;font-family:system-ui,sans-serif;overflow:hidden;color:#292a23}
  [hidden]{display:none !important}
  canvas{display:block}
  .startng-card{position:fixed;top:16px;left:16px;display:flex;align-items:center;gap:12px;padding:8px 16px 8px 8px;border-radius:999px;background:#292a23;color:#fffefa}
  .startng-card img{width:48px;height:48px;border-radius:50%;background:#d8fd71}
  .startng-card b{display:block;font-size:16px}
  .startng-card span{font-size:12px;opacity:.7}
  .startng-card button{margin-left:8px;border:0;border-radius:999px;padding:6px 12px;background:#d8fd71;font-weight:700;cursor:pointer}
  #hud{position:fixed;top:16px;right:16px;background:#292a23;color:#fffefa;padding:10px 16px;border-radius:16px;font-size:15px;line-height:1.6;text-align:right}
  #hud b{color:#d8fd71}
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f6f5eecc}
  #panel{background:#fffefa;border:1px solid #e3e1d3;border-radius:20px;padding:24px 28px;max-width:420px;width:calc(100% - 48px);text-align:center}
  #panel h1{margin:0 0 6px;font-size:28px}
  #panel p{margin:6px 0 14px;color:#5b5c52}
  #panel button{border:0;border-radius:999px;padding:10px 22px;background:#292a23;color:#fff;font-weight:700;font-size:16px;cursor:pointer}
  ol{text-align:left;padding-left:26px;margin:0 0 16px}
  li.me{background:#d8fd71;border-radius:6px}
</style>
</head>
<body>
<div class="startng-card" id="player-card" hidden>
  <img id="player-face" alt="">
  <div><b id="player-name"></b><span id="player-account"></span></div>
  <button id="player-sign-in" hidden>Sign in</button>
</div>
<div id="hud" hidden></div>
<div id="overlay"><div id="panel"></div></div>

<script src="three.min.js"></script>
<script>
/* ---------- start.ng connect helper (from start.ng/docs.md) ---------- */
const START_NG = 'https://start.ng';
let frame;
function connectFrame() {
  frame ??= new Promise((resolve, reject) => {
    const el = document.createElement('iframe');
    el.src = `${START_NG}/connect`; el.hidden = true;
    el.onload = () => resolve(el); el.onerror = reject;
    document.body.append(el);
  });
  return frame;
}
async function askStartNg(message, replyType, timeoutMs = 5000) {
  const el = await connectFrame();
  return new Promise((resolve) => {
    const requestId = Math.random().toString(36).slice(2);
    const done = (r) => { clearTimeout(timer); removeEventListener('message', onMessage); resolve(r); };
    const timer = setTimeout(() => done(null), timeoutMs);
    function onMessage(e) {
      if (e.origin !== START_NG || e.source !== el.contentWindow) return;
      if (e.data?.type === replyType && e.data.requestId === requestId) done(e.data);
    }
    addEventListener('message', onMessage);
    el.contentWindow.postMessage({ ...message, requestId }, START_NG);
  });
}
const signInUrl = () => `${START_NG}/?return_to=${encodeURIComponent(location.origin + location.pathname)}`;

/* ---------------------------- scene ---------------------------- */
const ARENA = 30, ROUND_SECONDS = 60;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f5ee);
scene.fog = new THREE.Fog(0xf6f5ee, 40, 90);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b6a5, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 0.7); sun.position.set(10, 20, 8); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA * 2 + 4, ARENA * 2 + 4), new THREE.MeshStandardMaterial({ color: 0xe9e7d8 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);
scene.add(new THREE.GridHelper(ARENA * 2, 30, 0xc9c7b4, 0xdad8c7));

/* ------------- character built from the start.ng style -------------- */
const DEFAULT_STYLE = { body: 'female', primaryColor: '#a55eea', secondaryColor: '#0c6e5a', skinColor: '#8d5524',
  hairColor: '#17120f', hair: 'short', hat: 'none', accessory: 'none' };
const hex = (v, d) => (/^#[0-9a-f]{6}$/i.test(v) ? v : d);
const mat = (c) => new THREE.MeshStandardMaterial({ color: c });
const part = (geo, c, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat(c)); m.position.set(x, y, z); return m; };

function nameSprite(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 64;
  const g = c.getContext('2d'); g.font = 'bold 30px sans-serif'; g.textAlign = 'center';
  g.lineWidth = 6; g.strokeStyle = '#fffefa'; g.strokeText(text, 128, 42);
  g.fillStyle = '#292a23'; g.fillText(text, 128, 42);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  s.scale.set(3.2, 0.8, 1); s.position.y = 3.4; return s;
}

function buildCharacter(rawStyle, name) {
  const s = { ...DEFAULT_STYLE, ...(rawStyle || {}) };
  const top = hex(s.primaryColor, DEFAULT_STYLE.primaryColor), bottom = hex(s.secondaryColor, DEFAULT_STYLE.secondaryColor);
  const skin = hex(s.skinColor, DEFAULT_STYLE.skinColor), hairC = hex(s.hairColor, DEFAULT_STYLE.hairColor);
  const g = new THREE.Group(), male = s.body === 'male';

  const legs = [-0.22, 0.22].map(x => { const l = new THREE.Group(); l.position.set(x, 1.0, 0);
    const m = part(new THREE.BoxGeometry(0.36, 1.0, 0.4), bottom, 0, -0.5, 0); l.add(m); g.add(l); return l; });
  if (!male) g.add(part(new THREE.CylinderGeometry(0.45, 0.7, 0.55, 16), bottom, 0, 1.05, 0)); // skirt
  g.add(part(new THREE.BoxGeometry(male ? 1.1 : 0.9, 1.0, 0.55), top, 0, 1.55, 0));            // torso
  [-1, 1].forEach(sx => g.add(part(new THREE.BoxGeometry(0.28, 0.9, 0.3), skin, sx * (male ? 0.7 : 0.6), 1.5, 0))); // arms
  g.add(part(new THREE.SphereGeometry(0.5, 20, 16), skin, 0, 2.4, 0));                          // head
  [-0.18, 0.18].forEach(x => g.add(part(new THREE.SphereGeometry(0.06, 8, 8), 0x17120f, x, 2.45, 0.46))); // eyes

  const cap = (r) => part(new THREE.SphereGeometry(r, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), hairC, 0, 2.5, 0);
  switch (s.hair) {
    case 'afro': g.add(part(new THREE.SphereGeometry(0.72, 20, 16), hairC, 0, 2.7, -0.05)); break;
    case 'bun': g.add(cap(0.53), part(new THREE.SphereGeometry(0.2, 12, 10), hairC, 0, 3.12, 0)); break;
    case 'ponytail': g.add(cap(0.53), part(new THREE.CylinderGeometry(0.1, 0.16, 0.8, 8), hairC, 0, 2.3, -0.55)); break;
    case 'braids': case 'dreads': {
      g.add(cap(0.53));
      const n = s.hair === 'braids' ? 5 : 7, len = s.hair === 'braids' ? 0.9 : 0.7;
      for (let i = 0; i < n; i++) { const a = Math.PI * (0.15 + 0.7 * i / (n - 1)) + Math.PI / 2;
        g.add(part(new THREE.CylinderGeometry(0.06, 0.05, len, 6), hairC, Math.cos(a) * 0.52, 2.15, Math.sin(a) * 0.52 * -1 - 0.05)); }
      break; }
    case 'bald': break;
    default: g.add(cap(0.53)); // short
  }
  switch (s.hat) {
    case 'cap': g.add(part(new THREE.SphereGeometry(0.56, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), top, 0, 2.55, 0), part(new THREE.BoxGeometry(0.7, 0.06, 0.5), top, 0, 2.58, 0.55)); break;
    case 'beanie': g.add(part(new THREE.SphereGeometry(0.58, 20, 12, 0, Math.PI * 2, 0, Math.PI / 2), bottom, 0, 2.55, 0), part(new THREE.SphereGeometry(0.12, 10, 8), top, 0, 3.15, 0)); break;
    case 'tophat': g.add(part(new THREE.CylinderGeometry(0.75, 0.75, 0.08, 20), 0x1c1c1c, 0, 2.85, 0), part(new THREE.CylinderGeometry(0.45, 0.45, 0.7, 20), 0x1c1c1c, 0, 3.2, 0)); break;
    case 'crown': { g.add(part(new THREE.CylinderGeometry(0.5, 0.45, 0.3, 16), 0xf5c518, 0, 2.95, 0));
      for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; g.add(part(new THREE.ConeGeometry(0.1, 0.25, 6), 0xf5c518, Math.cos(a) * 0.45, 3.2, Math.sin(a) * 0.45)); } break; }
  }
  switch (s.accessory) {
    case 'glasses': [-0.18, 0.18].forEach(x => { const r = part(new THREE.TorusGeometry(0.13, 0.025, 8, 16), 0x17120f, x, 2.45, 0.48); g.add(r); }); break;
    case 'earrings': [-1, 1].forEach(sx => g.add(part(new THREE.SphereGeometry(0.07, 8, 8), 0xf5c518, sx * 0.5, 2.2, 0))); break;
    case 'beard': g.add(part(new THREE.BoxGeometry(0.6, 0.3, 0.25), hairC, 0, 2.1, 0.35)); break;
    case 'scarf': g.add(part(new THREE.TorusGeometry(0.4, 0.12, 8, 18), bottom, 0, 2.02, 0)); g.children.at(-1).rotation.x = Math.PI / 2; break;
    case 'backpack': g.add(part(new THREE.BoxGeometry(0.7, 0.9, 0.35), bottom, 0, 1.6, -0.45)); break;
  }
  g.add(nameSprite(name || 'Player'));
  g.userData.legs = legs;
  return g;
}
function animateWalk(g, moving, t) {
  const sw = moving ? Math.sin(t * 12) * 0.7 : 0;
  g.userData.legs[0].rotation.x = sw; g.userData.legs[1].rotation.x = -sw;
}

/* ------------------------------ state ------------------------------ */
let player = null;         // { id|null, name, account, style, face, signedIn }
let me = null;
const remotes = new Map();  // id -> { group, tx, tz, try, moving }
const orbs = [];
let playing = false, score = 0, timeLeft = ROUND_SECONDS, ws = null, lastSend = 0;
const keys = {};
addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

/* ----------------------- who's playing + card ---------------------- */
async function loadPlayer() {
  const reply = await askStartNg({ type: 'startng:whoami' }, 'startng:user');
  const u = reply?.user;
  const p = u ?? reply?.guest;
  return p ? { id: u?.id ?? null, name: p.name, account: u?.account ?? null, style: p.style, face: p.face, signedIn: !!u }
            : { id: null, name: 'Guest', account: null, style: DEFAULT_STYLE, face: null, signedIn: false }; // e.g. opened as a local file
}
function applyPlayer(p) {
  player = p;
  const card = document.getElementById('player-card');
  if (p.face) document.getElementById('player-face').src = p.face; else document.getElementById('player-face').removeAttribute('src');
  document.getElementById('player-name').textContent = p.name;
  document.getElementById('player-account').textContent = p.account ? `@${p.account}` : 'Not signed in';
  const btn = document.getElementById('player-sign-in');
  btn.hidden = p.signedIn; btn.onclick = () => (location.href = signInUrl());
  card.hidden = false;
  const pos = me ? me.position.clone() : new THREE.Vector3();
  if (me) scene.remove(me);
  me = buildCharacter(p.style, p.name); me.position.copy(pos); scene.add(me);
}
async function refreshPlayer() {           // player may have signed in/out on start.ng
  const p = await loadPlayer();
  if (!player || p.id !== player.id || p.signedIn !== player.signedIn) { applyPlayer(p); connectRoom(); }
}
addEventListener('focus', refreshPlayer);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshPlayer(); });

/* ---------------------- multiplayer (live room) --------------------- */
async function connectRoom() {
  try { ws?.close(); } catch {}
  remotes.forEach(r => scene.remove(r.group)); remotes.clear(); ws = null;
  if (!player?.signedIn) return;
  const t = await askStartNg({ type: 'startng:ticket' }, 'startng:ticketData');
  if (!t?.ok || !t.url) return;                       // solo play still works
  const socket = new WebSocket(`${t.url}${t.url.includes('?') ? '&' : '?'}ticket=${encodeURIComponent(t.ticket)}`);
  ws = socket; let myId = null;
  const add = (p) => {
    if (!p || p.id == null || p.id === myId || remotes.has(p.id)) return;
    const g = buildCharacter(p.style, p.name); g.position.set(p.x || 0, 0, p.z || 0); scene.add(g);
    remotes.set(p.id, { group: g, tx: p.x || 0, tz: p.z || 0, ry: p.ry || 0, moving: !!p.moving });
  };
  socket.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'welcome') { myId = typeof m.you === 'object' ? m.you?.id : m.you; (m.players || []).forEach(add); }
    else if (m.type === 'join') add(m.player ?? m);
    else if (m.type === 'leave') { const id = m.id ?? m.player?.id, r = remotes.get(id); if (r) { scene.remove(r.group); remotes.delete(id); } }
    else if (m.type === 'move') { const r = remotes.get(m.id ?? m.player?.id); if (r) Object.assign(r, { tx: m.x, tz: m.z, ry: m.ry, moving: !!m.moving }); }
  };
  socket.onclose = () => { if (ws === socket) ws = null; };
}

/* ------------------------------ orbs ------------------------------- */
const orbMat = new THREE.MeshStandardMaterial({ color: 0xa6d61a, emissive: 0x3a4a00 });
function spawnOrb() {
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), orbMat);
  m.position.set((Math.random() - .5) * ARENA * 1.8, 1, (Math.random() - .5) * ARENA * 1.8);
  scene.add(m); orbs.push(m);
}

/* --------------------------- round flow ---------------------------- */
const panel = document.getElementById('panel'), overlay = document.getElementById('overlay'), hud = document.getElementById('hud');
function showStart() {
  panel.innerHTML = `<h1>Orb Rush</h1><p>Grab as many orbs as you can in ${ROUND_SECONDS} seconds.<br>WASD / arrow keys to move.</p>
    ${player?.signedIn ? '' : '<p><b>Sign in on start.ng to save your score.</b></p>'}<button id="go">Play</button>`;
  overlay.hidden = false; document.getElementById('go').onclick = startRound;
}
function startRound() {
  orbs.forEach(o => scene.remove(o)); orbs.length = 0;
  for (let i = 0; i < 14; i++) spawnOrb();
  me.position.set(0, 0, 0); score = 0; timeLeft = ROUND_SECONDS; playing = true;
  overlay.hidden = true; hud.hidden = false;
}
async function endRound() {
  playing = false; hud.hidden = true;
  panel.innerHTML = `<h1>${score} orbs!</h1><p id="status">Saving…</p><ol id="board"></ol><button id="again">Play again</button>`;
  overlay.hidden = false; document.getElementById('again').onclick = startRound;
  const status = document.getElementById('status');
  if (player?.signedIn) {
    const saved = await askStartNg({ type: 'startng:score', stats: { orbs: score } }, 'startng:scoreSaved');
    status.textContent = saved?.ok ? (saved.result.improved ? `New best! You're #${saved.result.rank}` : `Not your best this time (#${saved.result.rank})`)
                                   : (saved?.error || 'Could not save your score');
  } else status.textContent = 'Sign in on start.ng to save scores to the leaderboard.';
  const board = await askStartNg({ type: 'startng:leaderboard', limit: 10 }, 'startng:leaderboardData');
  const ol = document.getElementById('board');
  (board?.entries || []).forEach(e => {
    const li = document.createElement('li');
    li.textContent = `${e.name}: ${e.stats?.orbs ?? e.score} orbs`;
    if (player?.id != null && e.player_id === player.id) li.className = 'me';
    ol.append(li);
  });
}

/* ------------------------------ loop ------------------------------- */
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (me) {
    const dx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
    const dz = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
    const moving = playing && (dx || dz);
    if (moving) {
      const len = Math.hypot(dx, dz);
      me.position.x = THREE.MathUtils.clamp(me.position.x + dx / len * 9 * dt, -ARENA, ARENA);
      me.position.z = THREE.MathUtils.clamp(me.position.z + dz / len * 9 * dt, -ARENA, ARENA);
      me.rotation.y = Math.atan2(dx, dz);
    }
    animateWalk(me, moving, t);
    if (ws?.readyState === 1 && t - lastSend > 0.06) {
      lastSend = t; ws.send(JSON.stringify({ type: 'move', x: me.position.x, z: me.position.z, ry: me.rotation.y, moving: !!moving }));
    }
    if (playing) {
      timeLeft -= dt;
      for (let i = orbs.length - 1; i >= 0; i--) {
        orbs[i].rotation.y += dt * 2; orbs[i].position.y = 1 + Math.sin(t * 3 + i) * 0.15;
        if (Math.hypot(orbs[i].position.x - me.position.x, orbs[i].position.z - me.position.z) < 1.4) {
          scene.remove(orbs[i]); orbs.splice(i, 1); score++; spawnOrb();
        }
      }
      hud.innerHTML = `Time: <b>${Math.max(0, Math.ceil(timeLeft))}</b><br>Orbs: <b>${score}</b><br>Players: <b>${remotes.size + 1}</b>`;
      if (timeLeft <= 0) endRound();
    }
    camera.position.lerp(new THREE.Vector3(me.position.x, 15, me.position.z + 15), 0.08);
    camera.lookAt(me.position);
  }
  remotes.forEach(r => {
    const g = r.group, dx = r.tx - g.position.x, dz = r.tz - g.position.z;
    g.position.x += dx * Math.min(1, dt * 10); g.position.z += dz * Math.min(1, dt * 10);
    g.rotation.y = r.ry; animateWalk(g, r.moving, t);
  });
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

(async () => {
  applyPlayer(await loadPlayer());
  loop(); showStart(); connectRoom();
})();
</script>
</body>
</html>
